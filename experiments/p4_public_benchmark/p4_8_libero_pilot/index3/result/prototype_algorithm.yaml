{
  "name": "TRAIN_INTERACTION_MOTION_ONSET_V1",
  "seed": 1,
  "source_split": "frozen Train35 only; every third sorted Train episode reserved for proxy audit",
  "event": "first action[6] crossing from <0 to >0.5; command proxy, not physical contact",
  "offsets_frames": [
    -12,
    -8,
    -4,
    0,
    4,
    8,
    12,
    16,
    20
  ],
  "anchor_offset_index": 3,
  "resize": [
    224,
    224
  ],
  "flip_height_width_once": true,
  "dino": "frozen dinov2_vits14; single ImageNet normalization",
  "flow": {
    "method": "Farneback",
    "pyr_scale": 0.5,
    "levels": 3,
    "winsize": 21,
    "iterations": 3,
    "poly_n": 5,
    "poly_sigma": 1.2,
    "flags": 0
  },
  "candidate": {
    "pre_median_motion_max_px": 1.5,
    "post_median_motion_min_px": 2.0,
    "feature_cosine_min": 0.65,
    "forward_backward_error_max_px": 2.5,
    "ee_speed_correlation_min": 0.1,
    "premover_proximity_max_px": 42.0
