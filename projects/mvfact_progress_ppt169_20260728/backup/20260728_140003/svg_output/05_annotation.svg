<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1280" height="4" fill="#1A56DB"/>

  <text x="80" y="55" font-family="Microsoft YaHei, Arial, sans-serif" font-size="28" font-weight="700" fill="#1F2937">采用 CVAT 半自动标注 + SAM 2 离线生成 Mask 的双轨标注策略</text>

  <!-- Left: CVAT annotation flow -->
  <text x="80" y="100" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#1A56DB">检测标注 (CVAT)</text>

  <rect x="80" y="115" width="120" height="48" rx="0" fill="#1A56DB"/>
  <text x="140" y="144" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#FFFFFF" text-anchor="middle">CVAT 导入视频</text>
  <text x="220" y="144" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" fill="#1A56DB">→</text>
  <rect x="250" y="115" width="160" height="48" rx="0" fill="#1A56DB"/>
  <text x="330" y="144" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#FFFFFF" text-anchor="middle">Interpolation 逐帧标注</text>
  <text x="430" y="144" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" fill="#1A56DB">→</text>
  <rect x="460" y="115" width="140" height="48" rx="0" fill="#1A56DB"/>
  <text x="530" y="144" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#FFFFFF" text-anchor="middle">导出 XML 1.1</text>

  <!-- CVAT specs -->
  <rect x="80" y="185" width="540" height="120" rx="0" fill="#F0F4F8"/>
  <text x="110" y="215" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#1F2937">类别：cup (单类别) / 分辨率：640x480</text>
  <text x="110" y="240" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#1F2937">视角：Top (全局) + Wrist (腕部) / 双视角独立标注</text>
  <text x="110" y="265" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#1F2937">格式：CVAT 1.1 XML, track 模式, 每 episode 一个 XML</text>
  <text x="110" y="290" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#1F2937">训练加载：LabelLoader 解析 → 内存 cache → O(1) 查表</text>

  <!-- Right: SAM2 mask generation -->
  <text x="680" y="100" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#E0245E">Mask 生成 (SAM 2)</text>

  <rect x="680" y="115" width="130" height="48" rx="0" fill="#E0245E"/>
  <text x="745" y="144" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#FFFFFF" text-anchor="middle">XML 提取首帧 bbox</text>
  <text x="830" y="144" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" fill="#E0245E">→</text>
  <rect x="860" y="115" width="130" height="48" rx="0" fill="#E0245E"/>
  <text x="925" y="144" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#FFFFFF" text-anchor="middle">SAM 2 视频预测</text>
  <text x="1010" y="144" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" fill="#E0245E">→</text>
  <rect x="1040" y="115" width="130" height="48" rx="0" fill="#E0245E"/>
  <text x="1105" y="144" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#FFFFFF" text-anchor="middle">高斯模糊 + NPZ</text>

  <rect x="680" y="185" width="520" height="120" rx="0" fill="#F0F4F8"/>
  <text x="710" y="215" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#1F2937">输入：首帧 bbox prompt (xml 第0帧自动提取) + MP4 视频</text>
  <text x="710" y="240" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#1F2937">输出：episode_{idx:03d}.npz / shape=(718, 480, 640) float32, [0,1]</text>
  <text x="710" y="265" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#1F2937">处理：Gaussian blur sigma=2.0 → 软边界 mask</text>
  <text x="710" y="290" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#1F2937">训练加载：MaskLoader → LRU cache (8epoch) → O(1) 查表</text>

  <!-- Bottom: Dual annotation strategy comparison -->
  <text x="80" y="350" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#1F2937">双轨标注对比</text>

  <!-- Table -->
  <rect x="80" y="370" width="1120" height="32" rx="0" fill="#1A56DB"/>
  <text x="110" y="390" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">标注类型</text>
  <text x="320" y="390" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">工具</text>
  <text x="520" y="390" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">输出格式</text>
  <text x="720" y="390" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">粒度</text>
  <text x="880" y="390" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">用途</text>

  <rect x="80" y="402" width="1120" height="28" rx="0" fill="#FFFFFF"/>
  <text x="110" y="420" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#1F2937">检测标注 (bbox)</text>
  <text x="320" y="420" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#1F2937">CVAT 1.1</text>
  <text x="520" y="420" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#1F2937">XML (track+interpolation)</text>
  <text x="720" y="420" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#1F2937">稀疏 (4 个坐标)</text>
  <text x="880" y="420" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#1F2937">FCOS Detection Head → 检测损失</text>

  <rect x="80" y="430" width="1120" height="28" rx="0" fill="#F0F4F8"/>
  <text x="110" y="448" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#1F2937">分割标注 (mask)</text>
  <text x="320" y="448" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#1F2937">SAM 2 (离线)</text>
  <text x="520" y="448" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#1F2937">NPZ (718,480,640) float32</text>
  <text x="720" y="448" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#1F2937">密集 (每像素)</text>
  <text x="880" y="448" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#1F2937">Mask Decoder → Mask 损失</text>

  <!-- Bottom: generate script -->
  <rect x="80" y="490" width="1120" height="56" rx="0" fill="#F0F4F8"/>
  <text x="110" y="515" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="700" fill="#1F2937">SAM 2 生成命令 (Ubuntu):</text>
  <text x="360" y="515" font-family="Consolas, Courier New, monospace" font-size="14" fill="#1A56DB">python scripts/generate_sam2_masks.py --dataset_root /path/to/dataset --cameras top</text>
  <text x="110" y="538" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#6B7280">自动从 XML 提取首帧 bbox → SAM2 视频逐帧传播 → 高斯模糊 → save NPZ</text>

  <rect x="80" y="570" width="1120" height="1" fill="#E5E7EB"/>
  <text x="80" y="610" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#6B7280">数据集标注</text>
  <text x="1200" y="610" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#6B7280" text-anchor="end">5 / 12</text>
</svg>