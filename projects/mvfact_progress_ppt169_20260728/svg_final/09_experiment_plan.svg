<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1280" height="4" fill="#1A56DB"/>

  <text x="80" y="50" font-family="Microsoft YaHei, Arial, sans-serif" font-size="28" font-weight="700" fill="#1F2937">6 组核心实验覆盖 2 个数据集 x 3 个模型版本，训练参数统一控制</text>

  <!-- Table header -->
  <rect x="80" y="75" width="1120" height="32" rx="0" fill="#1A56DB"/>
  <text x="110" y="96" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">ID</text>
  <text x="160" y="96" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">数据集</text>
  <text x="380" y="96" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">模型版本</text>
  <text x="620" y="96" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">训练命令</text>
  <text x="1060" y="96" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">耗时</text>

  <!-- Row 1 -->
  <rect x="80" y="107" width="1120" height="28" rx="0" fill="#FFFFFF"/>
  <rect x="80" y="107" width="4" height="28" fill="#1A56DB"/>
  <text x="110" y="125" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" font-weight="700" fill="#1A56DB">E1</text>
  <text x="160" y="125" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#1F2937">A (无力感, 6dim)</text>
  <text x="380" y="125" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#1F2937">标准 ACT</text>
  <text x="620" y="125" font-family="Consolas, Courier New, monospace" font-size="12" fill="#6B7280">--policy.type=act</text>
  <text x="1060" y="125" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#6B7280">~8h</text>

  <!-- Row 2 -->
  <rect x="80" y="135" width="1120" height="28" rx="0" fill="#F0F4F8"/>
  <text x="110" y="153" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" font-weight="700" fill="#1A56DB">E2</text>
  <text x="160" y="153" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#1F2937">A (无力感, 6dim)</text>
  <text x="380" y="153" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#1F2937">论文版 (检测)</text>
  <text x="620" y="153" font-family="Consolas, Courier New, monospace" font-size="12" fill="#6B7280">--policy.type=act_det --policy.use_mask_guidance=false</text>
  <text x="1060" y="153" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#6B7280">~8h</text>

  <!-- Row 3 -->
  <rect x="80" y="163" width="1120" height="28" rx="0" fill="#FFFFFF"/>
  <rect x="80" y="163" width="4" height="28" fill="#E0245E"/>
  <text x="110" y="181" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" font-weight="700" fill="#E0245E">E3</text>
  <text x="160" y="181" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#1F2937">A (无力感, 6dim)</text>
  <text x="380" y="181" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#1F2937">检测 + Mask</text>
  <text x="620" y="181" font-family="Consolas, Courier New, monospace" font-size="12" fill="#6B7280">--policy.type=act_det --policy.use_mask_guidance=true</text>
  <text x="1060" y="181" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#6B7280">~8h</text>

  <!-- Divider -->
  <rect x="80" y="195" width="1120" height="1" fill="#E5E7EB"/>

  <!-- Row 4 -->
  <rect x="80" y="200" width="1120" height="28" rx="0" fill="#FFFFFF"/>
  <rect x="80" y="200" width="4" height="28" fill="#0EA5E9"/>
  <text x="110" y="218" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" font-weight="700" fill="#0EA5E9">E4</text>
  <text x="160" y="218" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#1F2937">B (有力感, 9dim)</text>
  <text x="380" y="218" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#1F2937">标准 ACT</text>
  <text x="620" y="218" font-family="Consolas, Courier New, monospace" font-size="12" fill="#6B7280">--policy.type=act</text>
  <text x="1060" y="218" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#6B7280">~8h</text>

  <!-- Row 5 -->
  <rect x="80" y="228" width="1120" height="28" rx="0" fill="#F0F4F8"/>
  <text x="110" y="246" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" font-weight="700" fill="#0EA5E9">E5</text>
  <text x="160" y="246" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#1F2937">B (有力感, 9dim)</text>
  <text x="380" y="246" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#1F2937">论文版 (检测)</text>
  <text x="620" y="246" font-family="Consolas, Courier New, monospace" font-size="12" fill="#6B7280">--policy.type=act_det --policy.use_mask_guidance=false</text>
  <text x="1060" y="246" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#6B7280">~8h</text>

  <!-- Row 6 -->
  <rect x="80" y="256" width="1120" height="28" rx="0" fill="#FFFFFF"/>
  <rect x="80" y="256" width="4" height="28" fill="#E0245E"/>
  <text x="110" y="274" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" font-weight="700" fill="#E0245E">E6</text>
  <text x="160" y="274" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#1F2937">B (有力感, 9dim)</text>
  <text x="380" y="274" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#1F2937">检测 + Mask</text>
  <text x="620" y="274" font-family="Consolas, Courier New, monospace" font-size="12" fill="#6B7280">--policy.type=act_det --policy.use_mask_guidance=true</text>
  <text x="1060" y="274" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#6B7280">~8h</text>

  <!-- Training params -->
  <text x="80" y="330" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" fill="#1F2937">统一训练参数</text>
  <rect x="80" y="345" width="1120" height="30" rx="0" fill="#F0F4F8"/>
  <text x="110" y="365" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#1F2937">steps=120,000 / batch=8 / chunk=100 / dim_model=512 / latent_dim=32 / lr=1e-5 / kl_weight=10 / det_weight=10 / mask_weight=1</text>

  <!-- Evaluation -->
  <text x="80" y="405" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" fill="#1F2937">评价指标：四阶段成功率</text>

  <rect x="80" y="425" width="1120" height="30" rx="0" fill="#1A56DB"/>
  <text x="130" y="445" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">阶段</text>
  <text x="320" y="445" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">度量</text>
  <text x="520" y="445" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">依赖</text>
  <text x="720" y="445" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">辅助指标</text>

  <rect x="80" y="455" width="1120" height="24" rx="0" fill="#FFFFFF"/>
  <text x="130" y="471" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#1F2937">1. 抓取杯子</text>
  <text x="320" y="471" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#1F2937">成功抓取 / 30 测试</text>
  <text x="520" y="471" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#1F2937">独立</text>
  <text x="720" y="471" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#1F2937">Action L1 Loss, Detection Loss</text>

  <rect x="80" y="479" width="1120" height="24" rx="0" fill="#F0F4F8"/>
  <text x="130" y="495" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#1F2937">2. 移动杯子</text>
  <text x="320" y="495" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#1F2937">成功移送 / 30 测试</text>
  <text x="520" y="495" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#1F2937">→ 1成功</text>
  <text x="720" y="495" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#1F2937">Mask Loss</text>

  <rect x="80" y="503" width="1120" height="24" rx="0" fill="#FFFFFF"/>
  <text x="130" y="519" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#1F2937">3. 放下杯子</text>
  <text x="320" y="519" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#1F2937">成功放置 / 30 测试</text>
  <text x="520" y="519" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#1F2937">→ 2成功</text>
  <text x="720" y="519" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#1F2937">力感信号变化 (数据集B)</text>

  <!-- Bottom: Comparison dimensions -->
  <text x="80" y="570" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" fill="#1F2937">对比维度</text>

  <rect x="80" y="588" width="360" height="36" rx="0" fill="#F0F4F8"/>
  <text x="260" y="610" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#1F2937" text-anchor="middle">E2-E1, E5-E4 → 检测的增量贡献</text>

  <rect x="460" y="588" width="360" height="36" rx="0" fill="#F0F4F8"/>
  <text x="640" y="610" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#1F2937" text-anchor="middle">E3-E2, E6-E5 → Mask的增量贡献</text>

  <rect x="840" y="588" width="360" height="36" rx="0" fill="#F0F4F8"/>
  <text x="1020" y="610" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#1F2937" text-anchor="middle">E4-E1 → 力感信号的基线提升</text>

  <rect x="80" y="640" width="1120" height="1" fill="#E5E7EB"/>
  <text x="80" y="670" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#6B7280">实验计划</text>
  <text x="1200" y="670" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#6B7280" text-anchor="end">9 / 12</text>
</svg>