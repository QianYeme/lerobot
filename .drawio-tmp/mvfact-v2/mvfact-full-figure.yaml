meta:
  profile: academic-paper
  figureType: architecture
  theme: academic-color
  layout: horizontal
  canvas: "1900x1350"
  print: { target: cn-thesis }
  title: "M-VF-ACT 模型训练架构图"
  description: "四阶段架构：(a)输入与Backbone (b)FPN与辅助监督分支 (c)特征融合与Transformer (d)输出与总损失"
  legend: "实线框 = 推理保留模块  |  虚线框 = 仅训练时的辅助模块  |  点线 = 梯度/损失流"

modules: []

nodes:
  # ══════════════════ Phase (a) — Input & Backbone — top-left ══════════════════
  - id: a_label
    label: "(a) 输入与Backbone"
    type: text
    bounds: { x: 40, y: 20, width: 200, height: 32 }
    style: { fontSize: 18, fontStyle: 1 }

  - id: a_top
    label: "Top Camera\n(480x640x3)"
    type: input
    bounds: { x: 40, y: 80, width: 118, height: 60 }
    style: { fontSize: 13 }

  - id: a_wrist
    label: "Wrist Camera\n(480x640x3)"
    type: input
    bounds: { x: 40, y: 280, width: 118, height: 60 }
    style: { fontSize: 13 }

  - id: a_aug
    label: "Data Aug\nColor / Noise\n/ Occlusion"
    type: process
    bounds: { x: 240, y: 70, width: 160, height: 70 }
    style: { fontSize: 12 }

  - id: a_resnet
    label: "Shared ResNet18\nlayer2 / layer3 / layer4"
    type: conv
    bounds: { x: 500, y: 140, width: 210, height: 76 }
    style: { fontSize: 13 }

  - id: a_f2
    label: "F2\n128ch\n60x80"
    type: tensor3d
    bounds: { x: 750, y: 70, width: 60, height: 64 }
    style: { fontSize: 11 }

  - id: a_f3
    label: "F3\n256ch\n30x40"
    type: tensor3d
    bounds: { x: 750, y: 152, width: 60, height: 64 }
    style: { fontSize: 11 }

  - id: a_f4
    label: "F4\n512ch\n15x20"
    type: tensor3d
    bounds: { x: 750, y: 234, width: 60, height: 64 }
    style: { fontSize: 11 }

  - id: a_note
    label: "(虚线=仅训练)"
    type: text
    bounds: { x: 240, y: 148, width: 90, height: 22 }
    style: { fontSize: 9, fontStyle: 2 }

  # ══════════════════ Phase (b) — FPN + Heads — top-right ══════════════════
  - id: b_label
    label: "(b) FPN与辅助监督分支 (仅训练)"
    type: text
    bounds: { x: 940, y: 20, width: 340, height: 32 }
    style: { fontSize: 18, fontStyle: 1 }

  - id: b_feat
    label: "F2/F3/F4\n(from ResNet18)"
    type: tensor3d
    bounds: { x: 940, y: 100, width: 100, height: 60 }
    style: { fontSize: 12 }

  - id: b_fpn
    label: "Feature Pyramid Network\nP2(60x80) / P3(30x40) / P4(15x20)"
    type: attention
    bounds: { x: 1110, y: 90, width: 260, height: 72 }
    style: { fontSize: 12 }

  - id: b_fcos
    label: "FCOS Detection Head\nCLS / REG / CTR Tower"
    type: process
    bounds: { x: 1420, y: 60, width: 190, height: 64 }
    style: { fontSize: 12 }

  - id: b_dloss
    label: "Detection Loss\nFocal + L1 + BCE"
    type: loss
    bounds: { x: 1420, y: 170, width: 160, height: 60 }
    style: { fontSize: 12 }

  - id: b_mask
    label: "Mask Decoder\nP4+P3+P2 -> 480x640"
    type: process
    bounds: { x: 1420, y: 290, width: 190, height: 64 }
    style: { fontSize: 12 }

  - id: b_mloss
    label: "Mask Loss\nL1 |pred - GT|"
    type: loss
    bounds: { x: 1420, y: 410, width: 140, height: 60 }
    style: { fontSize: 12 }

  - id: b_sam2
    label: "SAM2 GT Mask\n(.npz)"
    type: input
    bounds: { x: 1130, y: 420, width: 120, height: 56 }
    style: { fontSize: 12 }

  - id: b_note
    label: "(虚线=仅训练, 推理丢弃)"
    type: text
    bounds: { x: 1640, y: 310, width: 140, height: 22 }
    style: { fontSize: 9, fontStyle: 2 }

  # ══════════════════ Phase (c) — Fusion + Transformer — bottom-left ══════════════════
  - id: c_label
    label: "(c) 特征融合与Transformer"
    type: text
    bounds: { x: 40, y: 570, width: 280, height: 36 }
    style: { fontSize: 18, fontStyle: 1 }

  - id: c_fpn
    label: "FPN\nP2/P3/P4"
    type: tensor3d
    bounds: { x: 40, y: 630, width: 80, height: 56 }
    style: { fontSize: 12 }

  - id: c_f4
    label: "F4 skip"
    type: tensor3d
    bounds: { x: 40, y: 720, width: 80, height: 48 }
    style: { fontSize: 12 }

  - id: c_fusion
    label: "Detection-Feature Fusion\nAttention Map(15x20) x4\n-> Enhanced F4"
    type: attention
    bounds: { x: 180, y: 630, width: 230, height: 76 }
    style: { fontSize: 12 }

  - id: c_enh
    label: "Enhanced F4\n(512ch,15x20)"
    type: tensor3d
    bounds: { x: 480, y: 635, width: 110, height: 56 }
    style: { fontSize: 12 }

  - id: c_wrist
    label: "Wrist F4\n(512ch,15x20)"
    type: tensor3d
    bounds: { x: 40, y: 840, width: 100, height: 56 }
    style: { fontSize: 12 }

  - id: c_state
    label: "Robot State\n(9-dim)"
    type: input
    bounds: { x: 40, y: 950, width: 100, height: 56 }
    style: { fontSize: 12 }

  - id: c_enc
    label: "Transformer Encoder\n[Latent | State | Top Tokens | Wrist Tokens]\nMulti-Head Self-Attn + 2D PE"
    type: attention
    bounds: { x: 480, y: 770, width: 340, height: 84 }
    style: { fontSize: 12 }

  - id: c_dec
    label: "Transformer Decoder\nLearned Queries x Cross-Attention"
    type: attention
    bounds: { x: 480, y: 920, width: 270, height: 68 }
    style: { fontSize: 12 }

  # ══════════════════ Phase (d) — Output + Loss — bottom-right ══════════════════
  - id: d_label
    label: "(d) 输出与总损失"
    type: text
    bounds: { x: 940, y: 570, width: 180, height: 32 }
    style: { fontSize: 18, fontStyle: 1 }

  - id: d_dec
    label: "Decoder Output\n(B,chunk,512)"
    type: tensor3d
    bounds: { x: 940, y: 650, width: 120, height: 60 }
    style: { fontSize: 12 }

  - id: d_head
    label: "Action Head\nLinear(512->6)"
    type: output
    bounds: { x: 1120, y: 650, width: 140, height: 60 }
    style: { fontSize: 12 }

  - id: d_act
    label: "Predicted Actions\n(chunk_size, 6)"
    type: tensor3d
    bounds: { x: 1340, y: 650, width: 140, height: 60 }
    style: { fontSize: 12 }

  - id: d_aloss
    label: "Action L1 Loss"
    type: loss
    bounds: { x: 1060, y: 780, width: 140, height: 52 }
    style: { fontSize: 13 }

  - id: d_dloss
    label: "Detection Loss\n(Training Only)"
    type: loss
    bounds: { x: 1240, y: 780, width: 150, height: 56 }
    style: { fontSize: 12 }

  - id: d_mloss
    label: "Mask Loss\n(Training Only)"
    type: loss
    bounds: { x: 1420, y: 780, width: 140, height: 56 }
    style: { fontSize: 12 }

  - id: d_total
    label: "Total Loss = Action_L1 + KL + det_weight x Det_Loss + mask_weight x Mask_Loss"
    type: formula
    bounds: { x: 940, y: 900, width: 720, height: 48 }
    style: { fontSize: 14 }

  - id: d_legend
    label: "▬▬ 实线=推理保留    - - 虚线=仅训练    ··· 点线=梯度/损失流"
    type: text
    bounds: { x: 940, y: 990, width: 500, height: 24 }
    style: { fontSize: 12 }

edges:
  # ---- Phase (a) edges ----
  - from: a_top
    to: a_aug
    type: primary
  - from: a_aug
    to: a_resnet
    type: primary
    label: "aug"
    labelOffset: { x: 0, y: 14 }
  - from: a_wrist
    to: a_resnet
    type: primary
    label: "orig"
    labelOffset: { x: 0, y: 14 }
  - from: a_resnet
    to: a_f2
    type: data
  - from: a_resnet
    to: a_f3
    type: data
  - from: a_resnet
    to: a_f4
    type: data

  # ---- Phase (b) edges ----
  - from: b_feat
    to: b_fpn
    type: primary
  - from: b_fpn
    to: b_fcos
    type: primary
  - from: b_fpn
    to: b_mask
    type: primary
  - from: b_fcos
    to: b_dloss
    type: optional
    label: "grad"
    labelOffset: { x: 14, y: 0 }
  - from: b_mask
    to: b_mloss
    type: optional
    label: "grad"
    labelOffset: { x: 14, y: 0 }
  - from: b_sam2
    to: b_mloss
    type: data
    label: "GT"
    labelOffset: { x: 0, y: 14 }

  # ---- Phase (c) edges ----
  - from: c_fpn
    to: c_fusion
    type: primary
    label: "P"
    labelOffset: { x: 0, y: 14 }
  - from: c_f4
    to: c_fusion
    type: data
    label: "skip"
    labelOffset: { x: 0, y: 14 }
  - from: c_fusion
    to: c_enh
    type: primary
  - from: c_enh
    to: c_enc
    type: primary
    label: "300 tkn"
    labelOffset: { x: 0, y: 14 }
  - from: c_wrist
    to: c_enc
    type: data
    label: "300 tkn"
    labelOffset: { x: 0, y: 14 }
  - from: c_state
    to: c_enc
    type: data
    label: "1 tkn"
    labelOffset: { x: 0, y: 14 }
  - from: c_enc
    to: c_dec
    type: primary

  # ---- Phase (d) edges ----
  - from: d_dec
    to: d_head
    type: primary
  - from: d_head
    to: d_act
    type: primary
  - from: d_act
    to: d_total
    type: optional
    label: "L1"
    labelOffset: { x: 0, y: 14 }
  - from: d_dloss
    to: d_total
    type: optional
    label: "det_weight"
    labelOffset: { x: 0, y: 14 }
  - from: d_mloss
    to: d_total
    type: optional
    label: "mask_weight"
    labelOffset: { x: 0, y: 14 }
