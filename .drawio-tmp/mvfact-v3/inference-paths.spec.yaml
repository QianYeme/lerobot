meta:
  profile: academic-paper
  figureType: architecture
  theme: academic-color
  layout: horizontal
  canvas: 1500x740
  print:
    target: cn-thesis
    widthPt: 700
    minPt: 7
  title: Inference-Path Comparison across Versions (V1 / V2-V3 / V4 / V5 / V6)
  description: >-
    Inference-time data path of each ACTDet version; all columns share the same ACT CVAE transformer (6-dim actions). V1
    (baseline ACT): backbone F4 only. V2/V3: FPN + Det-Feature Fusion (enhanced F4); the det/mask heads are
    training-only and dropped at inference. V4 adds the FCOS feature injection (Innov. 2), V5 adds the Mask f432
    injection (Innov. 3), V6 adds both; each injection appends 300 tokens to the encoder sequence (see Fig. 2b).
  legend: >-
    ✓ = runs at inference | ✗ = dropped at inference (training-only) | purple = feature injection (Innov. 2/3) | the ACT
    CVAE transformer is identical across versions
modules:
  - id: m1
    label: 'V1: baseline ACT'
  - id: m2
    label: 'V2/V3: det+mask'
  - id: m4
    label: 'V4: +FCOS inject'
  - id: m5
    label: 'V5: +Mask inject'
  - id: m6
    label: 'V6: +both inject'
