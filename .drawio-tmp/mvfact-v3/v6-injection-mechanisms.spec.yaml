meta:
  profile: academic-paper
  figureType: architecture
  theme: academic-color
  layout: horizontal
  canvas: 1500x960
  print:
    target: cn-thesis
    widthPt: 700
    minPt: 7
  title: 'Feature Injection Mechanisms (Innov. 2 FCOS Branch, Innov. 3 Mask Branch)'
  description: >-
    Zoom-in of the two injection paths in the V6 figure. (a) FCOS injection: the CLS/REG tower intermediate features
    cls_feature(128) and reg_feature(128) are concatenated (256ch), gated by centerness (1+sigmoid(ctr_pred)), projected
    256->512, position-encoded and pooled into 300 tokens; the final prediction layers and losses are training-only. (b)
    Mask injection: P4/P3/P2 are reduced to 32ch and fused in two rounds into f432 (32ch, 60x80); f432 feeds the
    training-only pred_mask upsample and the injection path (1x1 conv 32->512, adaptive avg pool to 15x20 = 300 tokens)
    that runs in training and inference.
  legend: Purple = injection path (train + inference) | Dotted = gradient / training only
modules:
  - id: panel_a
    label: (a) FCOS Feature Injection (Innov. 2)
  - id: panel_b
    label: (b) Mask Feature Injection (Innov. 3)
