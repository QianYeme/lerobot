meta:
  profile: academic-paper
  figureType: architecture
  theme: academic-color
  layout: horizontal
  canvas: 1500x1040
  print:
    target: cn-thesis
    widthPt: 700
    minPt: 7
  title: V6 Full-Injection Training Architecture (FCOS + Mask Feature Injection)
  description: >-
    Same V2/V3 backbone-FPN-ACT pipeline with the two explicit feature injections: the FCOS tower intermediate features
    (cls+reg, centerness-gated, projected 256->512) and the Mask Decoder fused feature f432 (32ch 60x80, pooled to
    15x20) become extra 300-token groups appended to the encoder sequence after the image tokens. The prediction layers
    (cls_logits/reg_pred/ctr_pred, pred_mask) stay training-only; the injection paths run in both training and
    inference.
  legend: >-
    Dashed container = training only | Dotted arrow = gradient / loss flow | Solid = training + inference | Purple =
    feature injection (Innov. 2/3)
modules:
  - id: input_stage
    label: Input
  - id: aug_stage
    label: Top View Only (Training Only)
  - id: backbone_stage
    label: Shared ResNet18 Backbone
  - id: det_stage
    label: Detection Branch
  - id: mask_stage
    label: Mask Branch
  - id: fusion_stage
    label: Detection-Feature Fusion (Training + Inference)
  - id: act_stage
    label: ACT Transformer (CVAE)
nodes:
  - id: top_cam
    label: |-
      Top RGB
      (3, 480, 640)
    type: input
    module: input_stage
    bounds:
      x: 30
      'y': 60
      width: 130
      height: 54
    style:
      fontSize: 15
  - id: wrist_cam
